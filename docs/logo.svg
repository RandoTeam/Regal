<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="108" height="108" rx="28" fill="url(#bgGrad)" />

  <!-- Tilted Tag Group (-14 degrees) -->
  <g transform="translate(54, 54) rotate(-14) translate(-54, -54)" filter="url(#subtleShadow)">
    <!-- Price Tag Body with Chamfered Top Corners -->
    <path d="M 44 26 
             L 64 26 
             L 74 38 
             L 74 78 
             A 6 6 0 0 1 68 84 
             L 40 84 
             A 6 6 0 0 1 34 78 
             L 34 38 
             Z" 
          fill="url(#tagGrad)" />

    <!-- Hole / Eyelet (Negative space cutout matching background) -->
    <circle cx="54" cy="35" r="4" fill="#0F172A" />
    <circle cx="54" cy="35" r="5.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />

    <!-- Percent Sign % -->
    <text x="54" y="56" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="900" 
          fill="#FFFFFF" 
          text-anchor="middle"
          letter-spacing="0.5">%</text>

    <!-- CENA Label -->
    <text x="54" y="73" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" 
          font-weight="800" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="1.5">CENA</text>

    <!-- Decorative Accent Line under CENA -->
    <line x1="44" y1="77" x2="64" y2="77" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
